<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 
    <title>ModalCriar</title>
  </head>
  <body>
    <section class="TituloModal">
      <div>
        <div class="modalAcoes">
          <button class="btnCriar" onclick="abrirModalCriar('modalCriar')">
            Adicionar Publicação
          </button>
          <button class="btnExcluir" onclick="abrirModalCriar('modalExcluir')">
            Excluir Publicação
          </button>
      </div>
    </section>
    <!-- Modal Visualizar -->
    <section class="criarModal">
      <div class="modalContainer" id="modalCriar">
        <label class="arquivo">
          <input type="file" accept="image/*" />
          <div class="arquivo-content">
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
            </svg>
            <span>Faça upload da imagem</span>
          </div>
        </label>
        
        <input class="modalInputText" type="text" placeholder="Título"/>
        <input class="modalInputText" type="text" placeholder="Descrição"/>
        <div class="modalAcoes">
          <button class="btnCancelar" onclick="fecharModalCriar('modalCriar')">
            Cancelar
          </button>
          <button class="btnCriar" onclick="abrirModalCriar('modalCriar')">
            Criar
          </button>
          
          <!-- modais de usuario -->



        </div>
      </div>
    </section>
  </body>
  <script src="../../../public/js/ModalCriar.js"></script>
</html>
